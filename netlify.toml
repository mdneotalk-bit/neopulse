[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/news to the Netlify function
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

# SPA fallback so client-side routes (/article/*, /news/*) work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
